name: Build Web & Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  build-android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build Signed Release APK
        working-directory: android
        env:
          LISTTUBE_KEYSTORE_BASE64: ${{ secrets.LISTTUBE_KEYSTORE_BASE64 }}
          LISTTUBE_STORE_PASSWORD: ${{ secrets.LISTTUBE_STORE_PASSWORD }}
          LISTTUBE_KEY_ALIAS: ${{ secrets.LISTTUBE_KEY_ALIAS }}
          LISTTUBE_KEY_PASSWORD: ${{ secrets.LISTTUBE_KEY_PASSWORD }}
        run: |
          if [ -n "$LISTTUBE_KEYSTORE_BASE64" ]; then
            echo "$LISTTUBE_KEYSTORE_BASE64" | base64 --decode > /tmp/listtube-signing.jks
            export LISTTUBE_KEYSTORE_PATH=/tmp/listtube-signing.jks
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../ListTube-android.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../ListTube-android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ListTube-android-apk
          path: ListTube-android.apk
      - name: Update Latest APK Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 ListTube-android.apk --clobber
            gh release delete-asset v1.0.0 AniTube-android.apk -y >/dev/null 2>&1 || true
          else
            gh release create v1.0.0 ListTube-android.apk --title "ListTube Android APK" --notes "Latest signed Android APK build ready to download and install."
          fi
