name: Build Web & Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  build-android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../AniTube-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AniTube-android-apk
          path: AniTube-android.apk
      - name: Update Latest APK Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 AniTube-android.apk --clobber
          else
            gh release create v1.0.0 AniTube-android.apk --title "AniTube Android APK" --notes "Latest Android APK build ready to download and install."
          fi
